name: AdminCorePlugin
version: ${version}
main: com.negativestudios.admincore.AdminCorePlugin
api-version: '${apiVersion}'
author: LAYON
website: LAYON
description: Herramientas administrativas para servidores Paper y Spigot ${targetLabel}.

commands:
  admincore:
    description: Configura el idioma de AdminCore.
    usage: /admincore lenguage <español|English>
  vanish:
    description: Activa o desactiva el modo vanish.
    usage: /vanish
  nick:
    description: Cambia temporalmente el nombre mostrado.
    usage: /nick <nombre|off>
  incognito:
    description: Activa o desactiva el nombre incognito.
    usage: /incognito
  hidenick:
    description: Oculta o muestra tu nombre sobre la cabeza.
    usage: /hidenick
  blockinfo:
    description: Muestra quien coloco el bloque que estas mirando.
    usage: /blockinfo
  invsee:
    description: Abre el inventario de un jugador.
    usage: /invsee <jugador>
  ecsee:
    description: Abre el ender chest de un jugador.
    usage: /ecsee <jugador>
  sign:
    description: Recibe un letrero con un mensaje.
    usage: /sign "mensaje"
  setsign:
    description: Establece tu letrero predeterminado.
    usage: /setsign <material>
  admin:
    description: Herramientas administrativas.
    usage: /admin <freeze|unfreeze> <jugador>

permissions:
  admincore.admin:
    default: op
    description: Acceso completo a AdminCorePlugin.

  help:
    description: Envía un mensaje privado a todos los jugadores OP.
    usage: /help <mensaje>
  plugins:
    description: Muestra los plugins instalados.
    usage: /plugins
