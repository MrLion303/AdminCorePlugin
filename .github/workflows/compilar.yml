name: Compilar AdminCorePlugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Compilar AdminCore 1.20.x
        run: |
          gradle clean build --no-daemon -Ptarget=1.20
          mkdir -p dist
          cp build/libs/AdminCorePlugin-1.20.x.jar dist/

      - name: Compilar AdminCore 1.21.x
        run: |
          gradle clean build --no-daemon -Ptarget=1.21
          cp build/libs/AdminCorePlugin-1.21.x.jar dist/

      - name: Compilar AdminCore 26.3
        run: |
          gradle clean build --no-daemon -Ptarget=26.3
          cp build/libs/AdminCorePlugin-26.3.jar dist/

      - name: Verificar JAR generados
        run: ls -lh dist/

      - name: Subir los tres JAR
        uses: actions/upload-artifact@v4
        with:
          name: AdminCorePlugin
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
